<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>DCoderGuy — Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@300;600&display=swap');
:root{--bg:#0a0e1a;--card:#11182a;--accent:#00f0ff;--text:#e8f1ff;}
body{font-family:'Inter',system-ui;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
h2{font-family:'Orbitron';font-size:2.5rem;margin-bottom:2rem;background:linear-gradient(135deg,var(--accent),#7b2cbf);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
form{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:1.25rem;padding:2rem;display:flex;flex-direction:column;gap:1rem;width:320px}
input{padding:.75rem 1rem;border-radius:.5rem;border:1px solid rgba(255,255,255,.1);background:#0d1220;color:var(--text);font-family:inherit}
button{padding:.75rem;background:linear-gradient(135deg,var(--accent),#7b2cbf);border:none;border-radius:.5rem;color:#fff;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<h2>DCoderGuy Admin</h2>
<form onsubmit="event.preventDefault(); this.innerHTML='<p>Login placeholder — connect your auth backend here! ✨</p>';">
<input type="text" placeholder="Username" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</body>
</html>
